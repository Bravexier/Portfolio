<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 380">
<!-- Archimage debout sur un rocher, plongé dans un grimoire qui flotte et luit : les pages
     tournent, des runes s'en échappent, le cristal du bâton pulse. -->
<style>
.glow{animation:pulse 3.2s ease-in-out infinite alternate}
.crystal{animation:pulse 2.4s ease-in-out infinite alternate}
.book{animation:float 4s ease-in-out infinite alternate}
.page{transform-box:view-box;transform-origin:224px 0;animation:flip 7s ease-in-out infinite}
.beard{transform-box:view-box;transform-origin:138px 128px;animation:sway 5s ease-in-out infinite alternate}
.rune{opacity:0;fill:none;stroke:#ffd77a;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;animation:rise 3.6s ease-out infinite}
.r2{animation-delay:-.7s}.r3{animation-delay:-1.4s}.r4{animation-delay:-2.1s}.r5{animation-delay:-2.8s}
.spark{fill:#dffbff;animation:twinkle 1.8s ease-in-out infinite alternate}
.s2{animation-delay:-.6s}.s3{animation-delay:-1.2s}
@keyframes pulse{from{opacity:.45}to{opacity:1}}
@keyframes float{from{transform:translateY(2px)}to{transform:translateY(-4px)}}
@keyframes flip{0%,78%{transform:scaleX(1);opacity:0}80%{opacity:1}90%{transform:scaleX(-1);opacity:1}92%,100%{transform:scaleX(-1);opacity:0}}
@keyframes sway{from{transform:rotate(-1.5deg)}to{transform:rotate(1.5deg)}}
@keyframes rise{0%{opacity:0;transform:translate(0,0)}20%{opacity:1}100%{opacity:0;transform:translate(6px,-70px)}}
@keyframes twinkle{from{opacity:.15}to{opacity:1}}
</style>
<defs>
<radialGradient id="bookglow"><stop offset="0" stop-color="#ffe7a3" stop-opacity=".9"/><stop offset="1" stop-color="#ffb84d" stop-opacity="0"/></radialGradient>
<radialGradient id="crystalglow"><stop offset="0" stop-color="#bff7ff" stop-opacity=".95"/><stop offset="1" stop-color="#5fd0ff" stop-opacity="0"/></radialGradient>
<radialGradient id="facelight" cx=".9" cy=".6" r=".7"><stop offset="0" stop-color="#ffd58a" stop-opacity=".55"/><stop offset="1" stop-color="#ffd58a" stop-opacity="0"/></radialGradient>
<linearGradient id="robe" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f3fa3"/><stop offset="1" stop-color="#231a56"/></linearGradient>
<linearGradient id="hat" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#271d5c"/><stop offset="1" stop-color="#4a3a9a"/></linearGradient>
<linearGradient id="beard" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6f3ec"/><stop offset="1" stop-color="#c9c3b6"/></linearGradient>
<linearGradient id="rock" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3e3253"/><stop offset="1" stop-color="#1d1629"/></linearGradient>
</defs>
