<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700">
<!-- Falaise et château au crépuscule : tour de mage, donjon, fenêtres éclairées qui vacillent,
     bannières au vent. -->
<style>
.lit{animation:flicker 2.6s ease-in-out infinite alternate}
.l2{animation-delay:-.9s}.l3{animation-delay:-1.7s}
.aura{animation:aura 4s ease-in-out infinite alternate}
.flag{transform-box:fill-box;transform-origin:0 50%;animation:wave 1.4s ease-in-out infinite alternate}
@keyframes flicker{from{opacity:.55}to{opacity:1}}
@keyframes aura{from{opacity:.25}to{opacity:.7}}
@keyframes wave{from{transform:skewY(-7deg) scaleX(.92)}to{transform:skewY(6deg)}}
</style>
<defs>
<linearGradient id="cliff" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a2d52"/><stop offset="1" stop-color="#1c1630"/></linearGradient>
<radialGradient id="window"><stop offset="0" stop-color="#ffd27a" stop-opacity=".8"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/></radialGradient>
<radialGradient id="magic"><stop offset="0" stop-color="#c9a6ff" stop-opacity=".9"/><stop offset="1" stop-color="#7a4cff" stop-opacity="0"/></radialGradient>
</defs>
<circle class="aura" cx="372" cy="70" r="46" fill="url(#magic)"/>
