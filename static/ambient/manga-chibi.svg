<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 320">
  <!-- Mascotte : un développeur en chibi, assis sur une pile de mangas, son ordinateur sur les
       genoux. Il cligne des yeux, tape, hoche la tête, sue de temps en temps ; le café fume. -->
  <style>
    .ink { stroke: #111; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
    .head { transform-origin: 150px 176px; animation: bob 3.2s ease-in-out infinite alternate; }
    .eyes { transform-box: fill-box; transform-origin: center; animation: blink 4.6s infinite; }
    .ahoge { transform-origin: 150px 30px; animation: sway 1.6s ease-in-out infinite alternate; }
    .hand-l { animation: type 0.22s ease-in-out infinite alternate; }
    .hand-r { animation: type 0.22s ease-in-out -0.11s infinite alternate; }
    .sweat { animation: sweat 7s ease-in infinite; }
    .steam path { animation: steam 2.4s ease-out infinite; }
    .steam path:nth-child(2) { animation-delay: -0.8s; }
    .steam path:nth-child(3) { animation-delay: -1.6s; }
    @keyframes bob { from { transform: rotate(-2deg); } to { transform: rotate(2.5deg) translateY(2px); } }
    @keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 96% { transform: scaleY(0.08); } }
    @keyframes sway { from { transform: rotate(-12deg); } to { transform: rotate(14deg); } }
    @keyframes type { to { transform: translateY(-4px); } }
    @keyframes sweat {
      0%, 62% { opacity: 0; transform: translateY(-6px); }
      68% { opacity: 1; transform: none; }
      90% { opacity: 1; transform: translateY(10px); }
      100% { opacity: 0; transform: translateY(14px); }
    }
    @keyframes steam {
      from { opacity: 0; transform: translateY(6px); }
      30% { opacity: 0.9; }
      to { opacity: 0; transform: translateY(-22px); }
    }
  </style>

  <ellipse cx="160" cy="306" rx="118" ry="9" fill="#000" opacity=".18"/>

  <!-- Pile de mangas. -->
  <g class="ink">
    <rect x="66" y="270" width="186" height="32" rx="3" fill="#0a64a4"/>
    <rect x="226" y="273" width="22" height="26" fill="#fffdf8"/>
    <rect x="80" y="242" width="164" height="28" rx="3" fill="#ffe066"/>
    <rect x="72" y="244" width="22" height="24" fill="#fffdf8"/>
    <rect x="74" y="216" width="160" height="26" rx="3" fill="#d1193f"/>
    <rect x="208" y="219" width="22" height="20" fill="#fffdf8"/>
  </g>
  <g stroke="#111" stroke-width="1.5" opacity=".5">
    <path d="M230 280h14M230 287h14M230 294h14M76 252h14M76 259h14M212 226h14M212 233h14"/>
  </g>
  <g fill="#fff" font-family="Yu Gothic, Meiryo, sans-serif" font-weight="700" font-size="13">
    <text x="112" y="291">漫画 1</text>
    <text x="118" y="261" fill="#111">漫画 2</text>
    <text x="112" y="234">漫画 3</text>
  </g>

  <!-- Café. -->
  <g class="steam" fill="none" stroke="#8aa4c2" stroke-width="2.5" stroke-linecap="round">
    <path d="M262 262c-5-7 5-11 0-18"/>
    <path d="M272 264c-5-7 5-11 0-18"/>
    <path d="M282 262c-5-7 5-11 0-18"/>
  </g>
  <g class="ink">
    <path d="M286 280c12 0 12 18 0 18" fill="none"/>
    <rect x="256" y="270" width="32" height="34" rx="5" fill="#fffdf8"/>
    <ellipse cx="272" cy="272" rx="14" ry="3.5" fill="#6b3f26" stroke-width="2"/>
  </g>

  <!-- Jambes et chaussures. -->
  <g class="ink">
    <rect x="116" y="206" width="26" height="62" rx="11" fill="#2b3550"/>
    <rect x="158" y="206" width="26" height="62" rx="11" fill="#2b3550"/>
    <ellipse cx="128" cy="270" rx="17" ry="9" fill="#fffdf8"/>
    <ellipse cx="172" cy="270" rx="17" ry="9" fill="#fffdf8"/>
  </g>

  <!-- Sweat à capuche. -->
  <path class="ink" d="M98 220 C94 186 102 160 122 152 H178 C198 160 206 186 202 220 Z" fill="#d1193f"/>
  <path d="M138 156 v18 M162 156 v18" stroke="#fffdf8" stroke-width="3" stroke-linecap="round"/>

  <!-- Ordinateur sur les genoux, couvercle vers nous. -->
  <rect class="ink" x="94" y="168" width="112" height="56" rx="7" fill="#cfd6de"/>
  <path d="M150 183 l4.4 8.9 9.8 1.4-7.1 6.9 1.7 9.8-8.8-4.6-8.8 4.6 1.7-9.8-7.1-6.9 9.8-1.4z" fill="#ffe066" stroke="#111" stroke-width="2" stroke-linejoin="round"/>
  <text x="114" y="215" font-family="Consolas, monospace" font-weight="700" font-size="11" fill="#2b3550">&lt;/&gt;</text>
  <circle class="ink hand-l" cx="94" cy="200" r="9" fill="#ffe3d0"/>
  <circle class="ink hand-r" cx="206" cy="200" r="9" fill="#ffe3d0"/>

  <!-- Tête. -->
  <g class="head">
    <ellipse class="ink" cx="150" cy="104" rx="74" ry="68" fill="#ffe3d0"/>
    <g class="eyes">
      <ellipse cx="122" cy="118" rx="12" ry="16" fill="#241b33"/>
      <ellipse cx="178" cy="118" rx="12" ry="16" fill="#241b33"/>
      <ellipse cx="122" cy="124" rx="8.5" ry="8.5" fill="#3f7fd8"/>
      <ellipse cx="178" cy="124" rx="8.5" ry="8.5" fill="#3f7fd8"/>
      <circle cx="126" cy="111" r="4.6" fill="#fff"/>
      <circle cx="182" cy="111" r="4.6" fill="#fff"/>
      <circle cx="118" cy="126" r="2" fill="#fff"/>
      <circle cx="174" cy="126" r="2" fill="#fff"/>
    </g>
    <g fill="none" stroke="#111" stroke-width="2.5">
      <rect x="101" y="100" width="42" height="36" rx="11"/>
      <rect x="157" y="100" width="42" height="36" rx="11"/>
      <path d="M143 116 q7 -5 14 0"/>
    </g>
    <path d="M108 106 l10 -4 M164 106 l10 -4" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity=".8"/>
    <ellipse cx="106" cy="146" rx="10" ry="5" fill="#ff9fb2" opacity=".75"/>
    <ellipse cx="194" cy="146" rx="10" ry="5" fill="#ff9fb2" opacity=".75"/>
    <path d="M141 150 Q150 160 159 150" fill="#c4364f" stroke="#111" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Cheveux en pointes, et la mèche rebelle. -->
    <path class="ink ahoge" d="M150 32 C138 10 160 -2 172 6 C158 8 152 18 150 32 Z" fill="#3b2b24"/>
    <path class="ink" d="M74 112 C66 58 104 28 150 28 C196 28 234 58 226 112 L216 90 L208 108 L198 78 L184 98 L172 70 L158 94 L148 66 L134 94 L122 70 L110 100 L98 80 L88 106 Z" fill="#3b2b24"/>
    <path d="M118 48 q18 -10 40 -8" stroke="#6b5246" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path class="sweat" d="M222 76 C228 88 232 94 227 100 C222 105 214 100 216 92 C217 86 222 76 222 76 Z" fill="#8fd3ff" stroke="#111" stroke-width="2"/>
  </g>
</svg>
